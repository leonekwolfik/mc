# .github/workflows/docker-publish.yml
name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tag: [ubuntu, alpine]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image locally (${{ matrix.tag }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.tag }}
          push: false
          load: true
          platforms: linux/amd64,linux/arm64
          tags: mc-test:${{ matrix.tag }}

      - name: Run tests
        uses: ./.github/actions/docker-tests
        with:
          image: mc-test:${{ matrix.tag }}

  push:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        tag: [ubuntu, alpine]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push ${{ matrix.tag }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.tag }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/midnight-commander:${{ matrix.tag }}

  publish:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push latest image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/midnight-commander:latest
