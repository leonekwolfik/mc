# .github/workflows/test.yml
name: Test Docker Images (CI)

on:
  push:
    branches-ignore:
      - main  # main jest obsługiwany przez build.yml (build + push + test)
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: ubuntu
            dockerfile: Dockerfile.ubuntu
          - tag: alpine
            dockerfile: Dockerfile.alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally (${{ matrix.tag }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          tags: mc-test:${{ matrix.tag }}

      - name: Run tests
        uses: ./.github/actions/docker-tests.yml
        with:
          image: mc-test:${{ matrix.tag }}
